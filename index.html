<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visor 360 Local</title>
  <style>
    html, body {
      margin: 0; 
      padding: 0;
      width: 100vw; 
      height: 100vh;
      overflow: hidden;
      display: flex; 
      justify-content: center; 
      align-items: center;
      background-color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      font-family: Arial, sans-serif;
    }
    #viewer-container {
      width: 100%; 
      height: 100%;
      display: flex; 
      justify-content: center; 
      align-items: center;
      cursor: grab;
      position: relative;
      overflow: hidden; /* Corta los márgenes blancos sobrantes */
    }
    #viewer-container:active { cursor: grabbing; }
    
    /* Zoom aumentado para eliminar los márgenes blancos superior e inferior */
    img { 
      width: 100%;
      height: 100%;
      object-fit: cover; /* Cambiado a cover para llenar el contenedor */
      transform: scale(1.1); /* Aumenta la figura para que llene la pantalla en móvil */
      transform-origin: center center;
    }
    
    #status-msg {
      position: absolute;
      color: #333;
      font-size: 14px;
      text-align: center;
      padding: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="viewer-container">
    <div id="status-msg">Cargando visor 360...</div>
    <img id="view-img" src="" style="display:none;" draggable="false" />
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id'); 
    const requestedFrames = Number.parseInt(params.get('frames'), 10);
    const totalFrames = requestedFrames > 0 && requestedFrames <= 1000 ? requestedFrames : 18;

    // Detectar la base URL exacta de GitHub Pages
    const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');

    if (productId) {
      const imgElement = document.getElementById('view-img');
      const statusMsg = document.getElementById('status-msg');
      const container = document.getElementById('viewer-container');
      
      let currentFrame = 1;
      let isDragging = false;
      let startX = 0;
      let shopifyFrames;
      let candidates = [];
      let candidateIndex = 0;

      function getCandidatePaths(id, frame) {
        const filename = encodeURIComponent(id) + '(' + frame + ')';
        return [
          shopifyFrames?.[frame],
          `${baseUrl}${filename}.jpg`,
          `${baseUrl}${filename}.JPG`,
          `${baseUrl}${filename}.png`
        ].filter(Boolean);
      }

      function loadFrame(frame) {
        candidates = getCandidatePaths(productId, frame);
        candidateIndex = 0;
        imgElement.src = candidates[candidateIndex];
      }

      imgElement.onload = function() {
        statusMsg.style.display = 'none';
        imgElement.style.display = 'block';
      };

      imgElement.onerror = function() {
        candidateIndex++;
        if (candidateIndex < candidates.length) {
          imgElement.src = candidates[candidateIndex];
          return;
        }
        statusMsg.textContent = `No se encontró el fotograma ${currentFrame} de ${productId}.`;
        statusMsg.style.display = 'block';
      };

      async function startViewer() {
        try {
          const response = await fetch(
            'https://raw.githubusercontent.com/scaledigital-g/visor360/main/shopify-frames.json',
            { signal: AbortSignal.timeout(2500) }
          );
          if (response.ok) {
            const index = await response.json();
            const frames = index[productId.toUpperCase()];
            if (Array.from({ length: totalFrames }, (_, i) => frames?.[i + 1])
              .every(url => typeof url === 'string' && url.startsWith('https://cdn.shopify.com/'))) {
              shopifyFrames = frames;
            }
          }
        } catch {
          // Conserva la carga local si el índice está temporalmente inaccesible.
        }
        loadFrame(currentFrame);
      }

      startViewer();

      // Controles táctiles y ratón
      const startAction = (x) => { isDragging = true; startX = x; };
      const stopAction = () => { isDragging = false; };
      const moveAction = (x) => {
        if (!isDragging) return;
        const delta = x - startX;
        if (Math.abs(delta) > 8) { // Sensibilidad mejorada para móviles
          if (delta > 0) {
            currentFrame = currentFrame >= totalFrames ? 1 : currentFrame + 1;
          } else {
            currentFrame = currentFrame <= 1 ? totalFrames : currentFrame - 1;
          }
          loadFrame(currentFrame);
          startX = x;
        }
      };

      container.addEventListener('mousedown', (e) => startAction(e.clientX));
      window.addEventListener('mouseup', stopAction);
      container.addEventListener('mousemove', (e) => moveAction(e.clientX));

      container.addEventListener('touchstart', (e) => startAction(e.touches[0].clientX));
      window.addEventListener('touchend', stopAction);
      container.addEventListener('touchmove', (e) => moveAction(e.touches[0].clientX));

    } else {
      document.getElementById('status-msg').innerText = "Falta el parámetro id en la URL.";
    }
  </script>

</body>
</html>
