<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 360</title>
  
  <!-- CSS y JS oficiales de Magic 360 -->
  <link rel="stylesheet" href="https://cdn.shopify.com/extensions/01a02d58-b181-7a87-b3b9-a8ab17bdae59/magic-360-226/assets/magic360.css">
  <script src="https://apps.magictoolbox.com/shopify/assets/magic360-93259759959.js" type="text/javascript"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      background-color: #ffffff;
    }
    .Magic360 {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>

  <div id="viewer"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    if (productId) {
      // Reconstruimos el enlace directo a las imágenes en Shopify CDN
      const viewer = document.getElementById('viewer');
      viewer.innerHTML = `
        <a class="Magic360" 
           data-options="filename:${productId}-{col}.jpg; columns:16; initialize-on:load;"
           href="https://cdn.shopify.com/s/files/1/0273/9503/1131/files/${productId}-1.jpg">
          <img src="https://cdn.shopify.com/s/files/1/0273/9503/1131/files/${productId}-1.jpg" />
        </a>
      `;
      Magic360.start();
    } else {
      document.body.innerHTML = "<p style='font-family:sans-serif; text-align:center;'>Falta el parámetro id del producto.</p>";
    }
  </script>

</body>
</html>
