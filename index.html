<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 360</title>
  
  <!-- Carga directa del motor sin bloqueos de Shopify -->
  <script src="https://scripts.sirv.com/sirvjs/v3/sirv.js"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      background-color: #ffffff;
    }
    .Sirv {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="container"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    if (productId) {
      const container = document.getElementById('container');
      container.innerHTML = `
        <div class="Sirv" data-src="https://scale75.com/cdn/shop/files/${productId}.spin"></div>
      `;
    } else {
      document.body.innerHTML = "<p style='font-family:sans-serif; text-align:center;'>Falta el parámetro id del producto.</p>";
    }
  </script>

</body>
</html>
