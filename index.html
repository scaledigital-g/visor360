<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>360° Viewer</title>
  <style>
    html, body {
      margin: 0; 
      padding: 0;
      width: 100vw; 
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      background-color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      font-family: Arial, sans-serif;
    }
    #viewer-container {
      width: 100%; 
      flex: 1;
      min-height: 0;
      touch-action: pan-y;
      display: flex; 
      justify-content: center; 
      align-items: center;
      cursor: grab;
      position: relative;
      overflow: hidden;
    }
    #viewer-container:active { cursor: grabbing; }
    
    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    #controls {
      box-sizing: border-box;
      flex: 0 0 auto;
      width: min(calc(100% - 24px), 27rem);
      margin: 0 0 max(10px, env(safe-area-inset-bottom));
      padding: 10px clamp(12px, 4vw, 20px) 7px;
      border: 1px solid #ecc2d7;
      border-radius: 16px;
      background: #fff7fb;
      box-shadow: 0 4px 14px rgba(40, 33, 24, 0.08);
      color: #573747;
      font: 13px/1.35 system-ui, sans-serif;
      text-align: center;
    }
    #control-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(14px, 5vw, 24px);
    }
    #zoom-toggle {
      min-height: 44px;
      min-width: 7.25rem;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: #DA046D;
      color: #fff;
      font: 600 13px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    #zoom-toggle:hover:not(:disabled) { background: #bc005d; }
    #zoom-toggle:disabled, #rotation:disabled { opacity: 0.55; cursor: default; }
    #zoom-toggle:focus-visible, #rotation:focus-visible {
      outline: 2px solid #ab0055;
      outline-offset: 2px;
    }
    #viewer-container[data-zoom] { touch-action: none; cursor: zoom-in; }
    #viewer-container[data-zoom="active"] { cursor: move; }
    #rotation {
      appearance: none;
      display: block;
      width: 100%;
      height: 44px;
      margin: 0;
      border-radius: 8px;
      background: transparent;
      cursor: ew-resize;
    }
    #rotation::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 8px;
      background: #efd0df;
    }
    #rotation::-moz-range-track {
      height: 6px;
      border-radius: 8px;
      background: #efd0df;
    }
    #rotation::-webkit-slider-thumb {
      appearance: none;
      width: 20px;
      height: 20px;
      margin-top: -7px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #DA046D;
      box-shadow: 0 1px 4px rgba(48, 45, 39, 0.3);
    }
    #rotation::-moz-range-thumb {
      box-sizing: border-box;
      width: 20px;
      height: 20px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #DA046D;
      box-shadow: 0 1px 4px rgba(48, 45, 39, 0.3);
    }
    #rotation-help { margin: 6px 0 2px; }
    #viewer-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #viewer-actions button {
      min-height: 44px;
      padding: 0 6px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #a60053;
      font: 600 13px/1.2 system-ui, sans-serif;
      cursor: pointer;
    }
    #viewer-actions button:hover { text-decoration: underline; }
    #viewer-actions button:focus-visible { outline: 2px solid #a60053; }
    #loading-frame {
      position: absolute;
      z-index: 1;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 10px;
      border-radius: 12px;
      background: #fff7fb;
      color: #573747;
      font: 12px/1.4 system-ui, sans-serif;
      pointer-events: none;
      white-space: nowrap;
    }

    #status-msg {
      position: absolute;
      color: #333;
      font-size: 14px;
      text-align: center;
      padding: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="viewer-container">
    <div id="status-msg">Loading 360° viewer…</div>
    <div id="loading-frame" role="status" hidden>Loading frame…</div>
    <img id="view-img" src="" style="display:none;" draggable="false" />
  </div>

  <div id="controls" hidden>
    <div id="control-row">
      <input id="rotation" type="range" min="1" value="1" aria-label="Rotate the figure" disabled>
      <button id="zoom-toggle" type="button" aria-controls="viewer-container" disabled>Zoom in</button>
    </div>
    <p id="rotation-help">Drag the figure or use the slider to rotate it.</p>
    <div id="viewer-actions">
      <button id="reset-view" type="button">Center</button>
      <button id="fullscreen" type="button">Full screen</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id'); 
    const requestedFrames = Number.parseInt(params.get('frames'), 10);
    const totalFrames = requestedFrames > 0 && requestedFrames <= 1000 ? requestedFrames : 18;

    // Detectar la base URL exacta de GitHub Pages
    const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');

    if (productId) {
      const imgElement = document.getElementById('view-img');
      const statusMsg = document.getElementById('status-msg');
      const container = document.getElementById('viewer-container');
      
      const slider = document.getElementById('rotation');
      const zoomButton = document.getElementById('zoom-toggle');
      const help = document.getElementById('rotation-help');
      const rotationHelp = help.textContent;
      const zoomScale = 2.5;
      let zoomX = 0;
      let zoomY = 0;

      function positionZoom(x, y) {
        const width = container.clientWidth;
        const height = container.clientHeight;
        if (!width || !height || !imgElement.naturalWidth || !imgElement.naturalHeight) return;
        const ratio = Math.min(width / imgElement.naturalWidth, height / imgElement.naturalHeight);
        const limitX = Math.max(0, (imgElement.naturalWidth * ratio * zoomScale - width) / 2);
        const limitY = Math.max(0, (imgElement.naturalHeight * ratio * zoomScale - height) / 2);
        zoomX = Math.max(-limitX, Math.min(limitX, x));
        zoomY = Math.max(-limitY, Math.min(limitY, y));
        imgElement.style.transform = 'translate(' + zoomX + 'px, ' + zoomY + 'px) scale(' + zoomScale + ')';
      }

      function focusZoom(clientX, clientY) {
        const bounds = container.getBoundingClientRect();
        const x = clientX - bounds.left - bounds.width / 2;
        const y = clientY - bounds.top - bounds.height / 2;
        const isActive = container.dataset.zoom === 'active';
        positionZoom(isActive ? zoomX - x : -x * zoomScale,
          isActive ? zoomY - y : -y * zoomScale);
        container.dataset.zoom = 'active';
        help.textContent = 'Drag to explore the detail or use the slider to rotate.';
      }

      zoomButton.addEventListener('click', event => {
        if (container.hasAttribute('data-zoom')) {
          delete container.dataset.zoom;
          imgElement.style.removeProperty('transform');
          zoomX = 0;
          zoomY = 0;
          zoomButton.textContent = 'Zoom in';
          help.textContent = rotationHelp;
          return;
        }
        container.dataset.zoom = 'select';
        zoomButton.textContent = 'Full view';
        help.textContent = 'Tap or click the area you want to zoom in on.';
        if (event.detail === 0) {
          const bounds = container.getBoundingClientRect();
          focusZoom(bounds.left + bounds.width / 2, bounds.top + bounds.height / 2);
        }
      });
      imgElement.addEventListener('load', () => {
        zoomButton.disabled = false;
        if (container.dataset.zoom === 'active') positionZoom(zoomX, zoomY);
      });
      window.addEventListener('resize', () => {
        if (container.dataset.zoom === 'active') positionZoom(zoomX, zoomY);
      });
      const fullscreen = document.getElementById('fullscreen');
      const page = document.documentElement;
      const canFullscreen = () => document.fullscreenEnabled && typeof page.requestFullscreen === 'function';
      if (!canFullscreen()) fullscreen.textContent = 'Open viewer';
      fullscreen.addEventListener('click', async () => {
        if (!canFullscreen() || fullscreen.dataset.fallback) {
          window.open(window.location.href, '_blank', 'noopener,noreferrer');
          return;
        }
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await page.requestFullscreen();
        } catch {
          fullscreen.dataset.fallback = 'true';
          fullscreen.textContent = 'Open viewer';
        }
      });
      document.addEventListener('fullscreenchange', () => {
        fullscreen.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
      });
      document.getElementById('reset-view').addEventListener('click', () => {
        if (container.hasAttribute('data-zoom')) zoomButton.click();
        selectFrame(1);
      });
      document.getElementById('controls').hidden = false;
      slider.max = totalFrames;

      let currentFrame = 1;
      let shopifyFrames;
      let drag;
      let pendingRender = false;
      let ready = false;
      const loadedFrames = new Map();

      const wrapFrame = frame => ((frame - 1) % totalFrames + totalFrames) % totalFrames + 1;

      function frameUrl(frame) {
        if (!loadedFrames.has(frame)) {
          const name = encodeURIComponent(productId) + '(' + frame + ')';
          const urls = [shopifyFrames?.[frame], ...['jpg', 'JPG', 'png'].map(ext => baseUrl + name + '.' + ext)].filter(Boolean);
          loadedFrames.set(frame, new Promise(resolve => {
            const image = new Image();
            let i = 0;
            image.onload = () => resolve(image.src);
            image.onerror = () => {
              if (++i < urls.length) image.src = urls[i];
              else resolve(null);
            };
            image.src = urls[i];
          }));
        }
        return loadedFrames.get(frame);
      }

      const loadingNotice = document.getElementById('loading-frame');
      let loadingTimer;

      async function renderFrame(frame) {
        clearTimeout(loadingTimer);
        loadingTimer = setTimeout(() => {
          if (frame === currentFrame && imgElement.style.display === 'block') loadingNotice.hidden = false;
        }, 350);
        const url = await frameUrl(frame);
        if (frame !== currentFrame) return;
        clearTimeout(loadingTimer);
        loadingNotice.hidden = true;
        if (!url) {
          statusMsg.textContent = 'Could not load frame ' + frame + ' for ' + productId + '.';
          statusMsg.style.display = 'block';
          return;
        }
        imgElement.src = url;
        imgElement.style.display = 'block';
        statusMsg.style.display = 'none';
        for (const offset of [-1, 1, -2, 2]) frameUrl(wrapFrame(frame + offset));
      }

      function selectFrame(frame) {
        if (!ready || frame === currentFrame) return;
        currentFrame = frame;
        slider.value = frame;
        if (!pendingRender) {
          pendingRender = true;
          requestAnimationFrame(() => {
            pendingRender = false;
            renderFrame(currentFrame);
          });
        }
      }

      async function startViewer() {
        try {
          const response = await fetch(
            'https://raw.githubusercontent.com/scaledigital-g/visor360/main/shopify-frames.json',
            { signal: AbortSignal.timeout(2500) }
          );
          if (response.ok) {
            const index = await response.json();
            const frames = index[productId.toUpperCase()];
            if (Array.from({ length: totalFrames }, (_, i) => frames?.[i + 1])
              .every(url => typeof url === 'string' && url.startsWith('https://cdn.shopify.com/'))) {
              shopifyFrames = frames;
            }
          }
        } catch {
          // Conserva la carga local si el índice está temporalmente inaccesible.
        }
        ready = true;
        slider.disabled = totalFrames < 2;
        renderFrame(currentFrame);
      }

      container.addEventListener('pointerdown', event => {
        if (!ready || drag || !event.isPrimary || event.button !== 0) return;
        const step = Math.max(12, Math.min(32, container.clientWidth / totalFrames));
        drag = {
          pointer: event.pointerId, x: event.clientX, y: event.clientY,
          frame: currentFrame, step, zoom: container.dataset.zoom,
          zoomX, zoomY, moved: false,
        };
        container.setPointerCapture(event.pointerId);
      });
      container.addEventListener('pointermove', event => {
        if (drag?.pointer !== event.pointerId) return;
        const dx = event.clientX - drag.x;
        const dy = event.clientY - drag.y;
        if (drag.zoom) {
          drag.moved ||= Math.hypot(dx, dy) > 5;
          if (drag.zoom === 'active' && drag.moved) positionZoom(drag.zoomX + dx, drag.zoomY + dy);
          return;
        }
        const distance = dx / drag.step;
        selectFrame(wrapFrame(drag.frame + Math.trunc(distance)));
      });
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
        container.addEventListener(type, event => {
          if (drag?.pointer !== event.pointerId) return;
          const tap = Math.hypot(event.clientX - drag.x, event.clientY - drag.y) <= 5;
          if (type === 'pointerup' && drag.zoom && !drag.moved && tap) focusZoom(event.clientX, event.clientY);
          drag = null;
        });
      }
      slider.addEventListener('input', () => selectFrame(Number(slider.value)));
      startViewer();

    } else {
      document.getElementById('status-msg').innerText = "The viewer link is missing a figure ID.";
    }
  </script>

</body>
</html>
