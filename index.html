<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visor 360 Local</title>
  <style>
    html, body {
      margin: 0; 
      padding: 0;
      width: 100vw; 
      height: 100vh;
      overflow: hidden;
      display: flex; 
      justify-content: center; 
      align-items: center;
      background-color: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      font-family: Arial, sans-serif;
    }
    #viewer-container {
      width: 100%; 
      height: 100%;
      display: flex; 
      justify-content: center; 
      align-items: center;
      cursor: grab;
      position: relative;
      overflow: hidden; /* Corta los márgenes blancos sobrantes */
    }
    #viewer-container:active { cursor: grabbing; }
    
    /* Zoom aumentado para eliminar los márgenes blancos superior e inferior */
    img { 
      width: 100%;
      height: 100%;
      object-fit: cover; /* Cambiado a cover para llenar el contenedor */
      transform: scale(1.1); /* Aumenta la figura para que llene la pantalla en móvil */
      transform-origin: center center;
    }
    
    #status-msg {
      position: absolute;
      color: #333;
      font-size: 14px;
      text-align: center;
      padding: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="viewer-container">
    <div id="status-msg">Cargando visor 360...</div>
    <img id="view-img" src="" style="display:none;" />
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id'); 
    const totalFrames = parseInt(params.get('frames')) || 18; 

    // Detectar la base URL exacta de GitHub Pages
    const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');

    if (productId) {
      const imgElement = document.getElementById('view-img');
      const statusMsg = document.getElementById('status-msg');
      const container = document.getElementById('viewer-container');
      
      let currentFrame = 1;
      let isDragging = false;
      let startX = 0;
      let extIndex = 0;

      function getCandidatePaths(id, frame) {
        return [
          `${baseUrl}${id}(${frame}).jpg`,
          `${baseUrl}${id}(${frame}).JPG`,
          `${baseUrl}${id}(${frame}).png`
        ];
      }

      function loadFrame(frame) {
        const candidates = getCandidatePaths(productId, frame);
        if (extIndex < candidates.length) {
          imgElement.src = candidates[extIndex];
        } else {
          statusMsg.innerHTML = `<b style="color:red;">No se encontró la imagen:</b><br>${productId}(${frame}).jpg`;
        }
      }

      imgElement.onload = function() {
        statusMsg.style.display = 'none';
        imgElement.style.display = 'block';
      };

      imgElement.onerror = function() {
        extIndex++;
        loadFrame(currentFrame);
      };

      loadFrame(currentFrame);

      // Controles táctiles y ratón
      const startAction = (x) => { isDragging = true; startX = x; };
      const stopAction = () => { isDragging = false; };
      const moveAction = (x) => {
        if (!isDragging) return;
        const delta = x - startX;
        if (Math.abs(delta) > 8) { // Sensibilidad mejorada para móviles
          if (delta > 0) {
            currentFrame = currentFrame >= totalFrames ? 1 : currentFrame + 1;
          } else {
            currentFrame = currentFrame <= 1 ? totalFrames : currentFrame - 1;
          }
          loadFrame(currentFrame);
          startX = x;
        }
      };

      container.addEventListener('mousedown', (e) => startAction(e.clientX));
      window.addEventListener('mouseup', stopAction);
      container.addEventListener('mousemove', (e) => moveAction(e.clientX));

      container.addEventListener('touchstart', (e) => startAction(e.touches[0].clientX));
      window.addEventListener('touchend', stopAction);
      container.addEventListener('touchmove', (e) => moveAction(e.touches[0].clientX));

    } else {
      document.getElementById('status-msg').innerText = "Falta el parámetro id en la URL.";
    }
  </script>

</body>
</html>
