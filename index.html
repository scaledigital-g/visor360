<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 360 Local</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex; justify-content: center; align-items: center;
      background-color: #ffffff;
      user-select: none;
      font-family: sans-serif;
    }
    #viewer-container {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      cursor: grab;
      position: relative;
    }
    #viewer-container:active { cursor: grabbing; }
    img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #status-msg {
      position: absolute;
      color: #666;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div id="viewer-container">
    <div id="status-msg">Cargando visor 360...</div>
    <img id="view-img" src="" style="display:none;" />
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id'); 
    const totalFrames = parseInt(params.get('frames')) || 18; 

    if (productId) {
      const imgElement = document.getElementById('view-img');
      const statusMsg = document.getElementById('status-msg');
      const container = document.getElementById('viewer-container');
      
      let currentFrame = 1;
      let isDragging = false;
      let startX = 0;

      function getImagePath(frame) {
        return `./${productId} (${frame}).jpg`;
      }

      function updateImage(frame) {
        imgElement.src = getImagePath(frame);
      }

      imgElement.onload = function() {
        statusMsg.style.display = 'none';
        imgElement.style.display = 'block';
      };

      imgElement.onerror = function() {
        statusMsg.innerHTML = `<b style="color:red;">Error al cargar la imagen:</b><br>${getImagePath(currentFrame)}<br><br><small>Verifica que las fotos estén subidas a GitHub con el nombre exacto.</small>`;
      };

      updateImage(currentFrame);

      const startAction = (x) => { isDragging = true; startX = x; };
      const stopAction = () => { isDragging = false; };
      const moveAction = (x) => {
        if (!isDragging) return;
        const delta = x - startX;
        if (Math.abs(delta) > 10) {
          if (delta > 0) {
            currentFrame = currentFrame >= totalFrames ? 1 : currentFrame + 1;
          } else {
            currentFrame = currentFrame <= 1 ? totalFrames : currentFrame - 1;
          }
          updateImage(currentFrame);
          startX = x;
        }
      };

      container.addEventListener('mousedown', (e) => startAction(e.clientX));
      window.addEventListener('mouseup', stopAction);
      container.addEventListener('mousemove', (e) => moveAction(e.clientX));

      container.addEventListener('touchstart', (e) => startAction(e.touches[0].clientX));
      window.addEventListener('touchend', stopAction);
      container.addEventListener('touchmove', (e) => moveAction(e.touches[0].clientX));

    } else {
      document.getElementById('status-msg').innerText = "Falta el parámetro id en la URL.";
    }
  </script>

</body>
</html>
